services:
  webui-for-pycaret:
    build: .
    container_name: webui-for-pycaret
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./exports:/app/exports
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=500
    restart: unless-stopped
